<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - RentEase</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

<div class="card shadow p-4 col-md-6 mx-auto">

<h2 class="text-center mb-4">Payment</h2>

<form onsubmit="payNow(event)">

<div class="mb-3">
<label>Card Holder Name</label>
<input type="text" class="form-control" required>
</div>

<div class="mb-3">
<label>Card Number</label>
<input type="text" class="form-control" maxlength="16" required>
</div>

<div class="row">

<div class="col">
<label>Expiry</label>
<input type="text" class="form-control" placeholder="MM/YY" required>
</div>

<div class="col">
<label>CVV</label>
<input type="password" class="form-control" maxlength="3" required>
</div>

</div>

<button class="btn btn-success w-100 mt-4">
Pay Now
</button>

</form>

</div>

</div>

<script>
function payNow(event){

event.preventDefault();

alert("Payment Successful!");

window.location.href="my-rentals.html";

}
</script>

</body>
</html>
