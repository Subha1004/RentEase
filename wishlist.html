<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist - RentEase</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">🏠 RentEase</a>

        <div>
            <a href="products.html" class="btn btn-outline-light">
                Products
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="text-center mb-4">❤️ My Wishlist</h2>

    <div id="wishlistItems"></div>

    <div class="text-center mt-4">
        <button class="btn btn-danger" onclick="clearWishlist()">
            Clear Wishlist
        </button>
    </div>

</div>

<script>

let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

let output = "";

if (wishlist.length === 0) {

    output = `
    <div class="alert alert-warning text-center">
        No Products in Wishlist
    </div>
    `;

} else {

    wishlist.forEach(function(item){

        output += `
        <div class="card shadow mb-3">
            <div class="card-body">
                <h4>${item.name}</h4>
                <p class="mb-2">Rent: ₹${item.price} / Month</p>

                <a href="product-details.html" class="btn btn-primary">
                    View Details
                </a>
            </div>
        </div>
        `;

    });

}

document.getElementById("wishlistItems").innerHTML = output;

function clearWishlist(){

    localStorage.removeItem("wishlist");

    alert("Wishlist Cleared!");

    location.reload();

}

</script>

<script src="js/script.js"></script>

</body>
</html>
