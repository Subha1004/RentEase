<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - RentEase</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">🏠 RentEase Admin</a>
    </div>
</nav>

<div class="container mt-5">

<h2 class="text-center mb-4">Admin Dashboard</h2>

<div class="row">

<div class="col-md-3 mb-4">
<div class="card bg-primary text-white text-center p-4">
<h3>3</h3>
<p>Total Products</p>
</div>
</div>

<div class="col-md-3 mb-4">
<div class="card bg-success text-white text-center p-4">
<h3 id="wishlistCount">0</h3>
<p>Wishlist Items</p>
</div>
</div>

<div class="col-md-3 mb-4">
<div class="card bg-warning text-dark text-center p-4">
<h3>5</h3>
<p>Total Rentals</p>
</div>
</div>

<div class="col-md-3 mb-4">
<div class="card bg-danger text-white text-center p-4">
<h3>10</h3>
<p>Registered Users</p>
</div>
</div>

</div>

</div>

<script>
let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
document.getElementById("wishlistCount").innerText = wishlist.length;
</script>

</body>
</html>
