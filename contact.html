<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - RentEase</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="index.html">RentEase</a>
</div>
</nav>

<div class="container mt-5">

<div class="row">

<div class="col-md-6">

<h2>Contact Us</h2>

<p><strong>Address:</strong> Chennai, Tamil Nadu</p>
<p><strong>Email:</strong> support@rentease.com</p>
<p><strong>Phone:</strong> +91 9876543210</p>

</div>

<div class="col-md-6">

<div class="card shadow p-4">

<h3>Send Message</h3>

<form onsubmit="sendMessage(event)">

<input type="text" id="name" class="form-control mb-3" placeholder="Your Name" required>

<input type="email" id="email" class="form-control mb-3" placeholder="Your Email" required>

<textarea id="message" class="form-control mb-3" rows="5" placeholder="Your Message" required></textarea>

<button class="btn btn-primary w-100">Send</button>

</form>

</div>

</div>

</div>

</div>

<script>

function sendMessage(event){

event.preventDefault();

alert("Message Sent Successfully!");

document.querySelector("form").reset();

}

</script>

</body>
</html>
