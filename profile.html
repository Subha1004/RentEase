<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - RentEase</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">🏠 RentEase</a>
    </div>
</nav>

<div class="container mt-5">

<div class="card shadow p-4 col-md-6 mx-auto">

<h2 class="text-center mb-4">My Profile</h2>

<form>

<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" class="form-control" value="Muthu Subha Lakshmi">
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" value="student@example.com">
</div>

<div class="mb-3">
<label class="form-label">Phone Number</label>
<input type="text" class="form-control" value="9876543210">
</div>

<div class="mb-3">
<label class="form-label">Address</label>
<textarea class="form-control" rows="3">Chennai</textarea>
</div>

<button type="button" class="btn btn-success w-100"
onclick="saveProfile()">
Save Profile
</button>

</form>

</div>

</div>

<script>
function saveProfile(){
    alert("Profile Saved Successfully!");
}
</script>

</body>
</html>
