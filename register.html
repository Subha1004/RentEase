<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - RentEase</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow">

<div class="card-body">

<h2 class="text-center mb-4">Create Account</h2>

<form onsubmit="registerUser(event)">

<div class="mb-3">
<label>Full Name</label>
<input type="text" id="name" class="form-control" placeholder="Enter Full Name" required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" id="email" class="form-control" placeholder="Enter Email" required>
</div>

<div class="mb-3">
<label>Phone Number</label>
<input type="tel" id="phone" class="form-control" placeholder="Enter Phone Number" required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" id="password" class="form-control" placeholder="Create Password" required>
</div>

<div class="mb-3">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>
</div>

<button class="btn btn-success w-100">
Register
</button>

<p class="text-center mt-3">
Already have an account?
<a href="login.html">Login</a>
</p>

</form>

</div>

</div>

</div>

</div>

</div>


<script>

function registerUser(event){

event.preventDefault();


let name = document.getElementById("name").value;
let email = document.getElementById("email").value;
let phone = document.getElementById("phone").value;
let password = document.getElementById("password").value;
let confirmPassword = document.getElementById("confirmPassword").value;


if(password !== confirmPassword){

    alert("Password does not match!");
    return;

}


let user = {

    name:name,
    email:email,
    phone:phone,
    password:password

};


localStorage.setItem("user", JSON.stringify(user));


alert("Registration Successful!");


window.location.href="login.html";


}

</script>


</body>
</html>
