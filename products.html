<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - RentEase</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="index.html">RentEase</a>

<a href="wishlist.html" class="btn btn-outline-light">
❤️ Wishlist
</a>

</div>
</nav>

<div class="container mt-5">

<h2 class="text-center mb-4">Available Products</h2>

<div class="row mb-4">
<div class="col-md-6 mx-auto">
<input type="text"
id="search"
class="form-control"
placeholder="Search Products..."
onkeyup="searchProduct()">
</div>
</div>

<div class="row">

<!-- Sofa -->
<div class="col-md-4 mb-4 product-card">
<div class="card shadow">

<img src="images/sofa.jpg" class="card-img-top" alt="Sofa">

<div class="card-body text-center">

<h4 class="product-name">Sofa</h4>

<p>₹599 / Month</p>

<p>⭐⭐⭐⭐⭐ (4.8)</p>

<p class="text-success fw-bold">✅ Available</p>

<a href="product-details.html?product=sofa"
class="btn btn-primary w-100">
View Details
</a>

<button
class="btn btn-danger mt-2 w-100"
onclick="addWishlist('Sofa',599)">
❤️ Add to Wishlist
</button>

</div>

</div>
</div>

<!-- Refrigerator -->
<div class="col-md-4 mb-4 product-card">
<div class="card shadow">

<img src="images/refrigerator.jpg" class="card-img-top" alt="Refrigerator">

<div class="card-body text-center">

<h4 class="product-name">Refrigerator</h4>

<p>₹899 / Month</p>

<p>⭐⭐⭐⭐☆ (4.5)</p>

<p class="text-success fw-bold">✅ Available</p>

<a href="product-details.html?product=refrigerator"
class="btn btn-primary w-100">
View Details
</a>

<button
class="btn btn-danger mt-2 w-100"
onclick="addWishlist('Refrigerator',899)">
❤️ Add to Wishlist
</button>

</div>

</div>
</div>

<!-- Washing Machine -->
<div class="col-md-4 mb-4 product-card">
<div class="card shadow">

<img src="images/washingmachine.jpg"
class="card-img-top"
alt="Washing Machine">

<div class="card-body text-center">

<h4 class="product-name">Washing Machine</h4>

<p>₹799 / Month</p>

<p>⭐⭐⭐⭐☆ (4.6)</p>

<p class="text-success fw-bold">✅ Available</p>

<a href="product-details.html?product=washingmachine"
class="btn btn-primary w-100">
View Details
</a>

<button
class="btn btn-danger mt-2 w-100"
onclick="addWishlist('Washing Machine',799)">
❤️ Add to Wishlist
</button>

</div>

</div>
</div>

</div>

</div>

<script src="js/script.js"></script>

</body>
</html>
