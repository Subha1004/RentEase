<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details - RentEase</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">🏠 RentEase</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">

        <!-- Product Image -->
        <div class="col-md-6">
            <img id="productImage"
                 class="img-fluid rounded shadow"
                 alt="Product">
        </div>

        <!-- Product Details -->
        <div class="col-md-6">

            <h2 id="productName"></h2>

            <h4 class="text-success" id="productPrice"></h4>

            <p id="productDescription"></p>

            <label class="form-label">Select Rental Duration</label>

            <select id="months" class="form-select">
                <option value="1">1 Month</option>
                <option value="3">3 Months</option>
                <option value="6">6 Months</option>
            </select>

            <h3 class="mt-3">
                Total :
                <span id="total"></span>
            </h3>

            <button class="btn btn-success w-100 mt-3"
                    onclick="rentProduct()">
                Rent Now
            </button>

        </div>

    </div>
</div>

<script>

const products = {

    sofa: {
        name: "Sofa",
        price: 599,
        image: "images/sofa.jpg",
        description: "Comfortable 3-Seater Sofa suitable for students and working professionals."
    },

    refrigerator: {
        name: "Refrigerator",
        price: 899,
        image: "images/refrigerator.jpg",
        description: "Double Door Refrigerator with energy-saving technology."
    },

    washingmachine: {
        name: "Washing Machine",
        price: 799,
        image: "images/washingmachine.jpg",
        description: "Fully Automatic Washing Machine suitable for home use."
    }

};

// Read product name from URL
const params = new URLSearchParams(window.location.search);
const key = params.get("product");

// Default product if URL is empty
const product = products[key] || products.sofa;

// Display Product
document.getElementById("productImage").src = product.image;
document.getElementById("productName").innerHTML = product.name;
document.getElementById("productPrice").innerHTML = "₹" + product.price + " / Month";
document.getElementById("productDescription").innerHTML = product.description;

let rent = product.price;

document.getElementById("total").innerHTML = "₹" + rent;

// Change Total
document.getElementById("months").addEventListener("change", function(){

    document.getElementById("total").innerHTML =
    "₹" + (rent * this.value);

});

// Rent Button
function rentProduct(){

    let rental = {

        product: product.name,

        months: document.getElementById("months").value,

        total: rent * document.getElementById("months").value

    };

    localStorage.setItem("rental", JSON.stringify(rental));

    alert(product.name + " rented successfully!");

    window.location.href = "my-rentals.html";

}

</script>

</body>
</html>
